# Ambiente de desenvolvimento local. Supabase é usado apenas em produção.
# Uso: docker compose up -d  →  Postgres em localhost:54322 (postgres/postgres)
services:
  db:
    image: postgres:17
    container_name: investidor100-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
