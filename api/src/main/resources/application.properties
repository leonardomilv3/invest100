# Configuração da API. Dev: Postgres via docker compose (porta 54322) + api/.env. Prod: Postgres Supabase + Environment do Render.
quarkus.application.name=investidor100-api
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
# Resources usam @Path("/api/v1/...") e jobs @Path("/internal/jobs/...") — não definir quarkus.rest.path

# Datasource — prod: Supabase session pooler (IPv4). Dev: docker compose (porta 54322)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:54322/postgres}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:5}
%test.quarkus.datasource.jdbc.url=
%test.quarkus.datasource.username=
%test.quarkus.datasource.password=
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17

quarkus.hibernate-orm.database.default-schema=app
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=app
quarkus.flyway.create-schemas=true

# JWT RS256 emitido e validado pela própria API (dev e prod). Chaves em env vars, em PEM base64 de uma linha
# (sem cabeçalhos): dev → api/.env gerado por scripts/gen-jwt-keys.sh; prod → Environment do Render.
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.issuer=${JWT_ISSUER:investidor100-api}
mp.jwt.verify.audiences=investidor100
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
smallrye.jwt.new-token.issuer=${mp.jwt.verify.issuer}
smallrye.jwt.new-token.audience=investidor100
smallrye.jwt.new-token.signature-algorithm=RS256
smallrye.jwt.new-token.lifespan=${JWT_ACCESS_TTL_SECONDS:900}
quarkus.http.auth.permission.authenticated.paths=/api/v1/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/*,/internal/jobs/*
quarkus.http.auth.permission.public.policy=permit

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-max-age=24H

# Integrações
app.jobs.secret=${JOBS_SECRET:dev-secret}
quarkus.rest-client.brapi.url=https://brapi.dev/api
app.brapi.token=${BRAPI_TOKEN:}

# OpenAPI / health
quarkus.smallrye-openapi.info-title=Investidor100 API
quarkus.swagger-ui.always-include=false
quarkus.jackson.write-dates-as-timestamps=false
quarkus.log.level=INFO

# Testes (docs/09 §6): par RSA de teste em src/test/resources/META-INF/microprofile-config.properties; Postgres via Dev Services
%test.mp.jwt.verify.publickey=${test.jwt.public-key}
%test.smallrye.jwt.sign.key=${test.jwt.private-key}
%test.app.jobs.secret=test-secret
%test.quarkus.rest-client.brapi.url=http://localhost:${quarkus.http.test-port}/fake-brapi
%test.quarkus.jacoco.data-file=target/jacoco-quarkus.exec
%test.quarkus.jacoco.report=false
%test.quarkus.jacoco.reuse-data-file=true
